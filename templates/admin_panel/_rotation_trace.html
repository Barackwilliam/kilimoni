<div class="card" style="margin-top:20px;">
  <div class="card-header"><div class="card-title">🔄 Mantiki ya mzunguko wa mazao</div></div>
  <div style="display:grid;grid-template-columns:190px 1fr;gap:6px 12px;font-size:13.5px;">
    <div style="color:#6b7280;">Uamuzi</div><div><strong>{{ t.decision }}</strong></div>
    <div style="color:#6b7280;">Zao la awali</div><div>{{ t.previous|default:"–" }}</div>
    <div style="color:#6b7280;">Zao linalofuata</div><div>{{ t.next|default:"(anauliza nini kifuate)" }}</div>
    <div style="color:#6b7280;">Kanda</div><div><code>{{ t.aez|default:"haijulikani" }}</code></div>
    <div style="color:#6b7280;">Kanuni / records zilizotumika</div><div><code>{{ t.rules_used|join:", "|default:"–" }}</code></div>
  </div>
</div>
