{% extends 'admin_panel/base.html' %}
{% block title %}{{ action }} Zao{% endblock %}
{% block page_title %}🌽 {{ action }} Zao{% endblock %}
{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-header">
    <div class="card-title">{{ action }} Zao</div>
    <a href="{% url 'crops_list' %}" class="btn btn-secondary btn-sm">← Rudi</a>
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Jina la Zao (Kiswahili) *</label>
        <input name="crop_name_sw" class="form-control" required value="{{ crop.crop_name_sw|default:'' }}">
      </div>
      <div class="form-group">
        <label class="form-label">Jina la Zao (English) *</label>
        <input name="crop_name_en" class="form-control" required value="{{ crop.crop_name_en|default:'' }}">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Kundi la Zao *</label>
        <select name="crop_group" class="form-control" required>
          {% for val, label in crop_groups %}
          <option value="{{ val }}" {% if crop.crop_group == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Kipaumbele (1=Juu)</label>
        <input name="priority_level" class="form-control" type="number" min="1" max="5" value="{{ crop.priority_level|default:1 }}">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Hali</label>
      <select name="active_status" class="form-control">
        <option value="active" {% if crop.active_status == 'active' or not crop %}selected{% endif %}>Active</option>
        <option value="inactive" {% if crop.active_status == 'inactive' %}selected{% endif %}>Inactive</option>
      </select>
    </div>
    <button type="submit" class="btn btn-primary">💾 Hifadhi</button>
    <a href="{% url 'crops_list' %}" class="btn btn-secondary" style="margin-left:8px;">Ghairi</a>
  </form>
</div>
{% endblock %}
