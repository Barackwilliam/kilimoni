services:
  - type: web
    name: mkulima-ai-tanzania
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn mkulima_ai.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "mkulima-ai-tanzania.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: mkulima-ai-db
          property: connectionString
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        value: "mkulima-ai-verify-2024"

databases:
  - name: mkulima-ai-db
    databaseName: mkulima_ai
    user: mkulima_ai
